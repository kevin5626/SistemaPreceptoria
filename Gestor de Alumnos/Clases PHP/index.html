
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Carga de datos</title>
</head>

<body>

    <h1>Carga de datos</h1>

    <form action="registroCliente.php" method="post">

        <h2>Datos del curso</h2>

        <label for="anio">Año:</label>
        <input type="number" id="anio" name="anio" required>
        <br><br>

        <label for="division">División:</label>
        <input type="number" id="division" name="division" required>
        <br><br>

        <label for="comision">Comisión:</label>
        <input type="text" id="comision" name="comision" required>
        <br><br>

        <label for="especialidad">Especialidad:</label>
        <select id="especialidad" name="especialidad" required>
            <option value="">Seleccionar</option>
            <option value="Ninguna">Ninguna</option>
            <option value="Alimentos">Alimentos</option>
            <option value="Maestro Mayor de Obra">Maestro Mayor de Obra</option>
            <option value="Electromecánica">Electromecánica</option>
            <option value="IPP">IPP</option>
            <option value="Programación">Programación</option>
        </select>
        <br><br>

        <label for="turno">Turno:</label>
        <select id="turno" name="turno" required>
            <option value="">Seleccionar</option>
            <option value="Mañana">Mañana</option>
            <option value="Tarde">Tarde</option>
            <option value="Vespertino">Vespertino</option>
        </select>
        <br><br>

        <label for="ciclo">Ciclo:</label>
        <select id="ciclo" name="ciclo" required>
            <option value="">Seleccionar</option>
            <option value="Básico">Básico</option>
            <option value="Superior">Superior</option>
        </select>
        <br><br>


        <h2>Datos del alumno</h2>

        <label for="dni_alumno">DNI:</label>
        <input type="number" id="dni_alumno" name="dni_alumno" required>
        <br><br>

        <label for="nombre_alumno">Nombre:</label>
        <input type="text" id="nombre_alumno" name="nombre_alumno" required>
        <br><br>

        <label for="apellido_alumno">Apellido:</label>
        <input type="text" id="apellido_alumno" name="apellido_alumno" required>
        <br><br>


        <h2>Datos del tutor</h2>

        <label for="nombre_tutor">Nombre:</label>
        <input type="text" id="nombre_tutor" name="nombre_tutor" required>
        <br><br>

        <label for="apellido_tutor">Apellido:</label>
        <input type="text" id="apellido_tutor" name="apellido_tutor" required>
        <br><br>


        <h2>Teléfono del tutor</h2>

        <label for="tipo_telefono">Tipo de teléfono:</label>
        <select id="tipo_telefono" name="tipo_telefono" required>
            <option value="">Seleccionar</option>
            <option value="celular">Celular</option>
            <option value="fijo">Fijo</option>
        </select>
        <br><br>

        <label for="codigo_area">Código de área:</label>
        <input type="number" id="codigo_area" name="codigo_area" required>
        <br><br>

        <label for="numero">Número:</label>
        <input type="number" id="numero" name="numero" required>
        <br><br>


        <input type="submit" value="Cargar datos">

    </form>

</body>
</html>
